name: Close issues

# GitHub closes issues from "Closes #N" only when a pull request reaches the default
# branch (main). Pull requests here target dev, so this workflow closes them on merge.
#
# It uses pull_request_target so it also works for pull requests from forks. It never
# checks out or runs code from the pull request, and the pull request body is read as
# data only.
on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close:
    name: Close linked issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;

            // Same keywords GitHub uses. "Refs #N" is not one of them, so it stays open.
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b:?[ \t]+#(\d+)\b/gi;
            const numbers = new Set(
              [...(pr.body ?? "").matchAll(keyword)].map((match) => Number(match[1])),
            );

            for (const number of numbers) {
              if (number === pr.number) continue;

              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number }));
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`#${number} does not exist.`);
                  continue;
                }
                throw error;
              }

              if (issue.pull_request) {
                core.info(`#${number} is a pull request, skipping.`);
                continue;
              }
              if (issue.state === "closed") {
                core.info(`#${number} is already closed.`);
                continue;
              }

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body: `Closed by #${pr.number}, merged into \`${pr.base.ref}\`.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed #${number}.`);
            }
