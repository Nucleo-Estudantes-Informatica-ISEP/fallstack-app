name: Close issues

# GitHub closes issues from "Closes #N" only when a pull request reaches the default
# branch (main). Pull requests here target dev, so this workflow closes them on merge.
#
# It uses pull_request_target so it also works for pull requests from forks. It checks
# out only this repository's base branch, never code from the pull request, and the pull
# request body is read as data only.
#
# Only a line that holds just a closing keyword and issue numbers counts, for example
# "Closes #4". See .github/scripts/closing-issues.js.
on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: Close linked issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # For pull_request_target this is the base branch, not the pull request.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;

            const { parseClosingIssues } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/closing-issues.js`,
            );
            const numbers = parseClosingIssues(pr.body);

            for (const number of numbers) {
              if (number === pr.number) continue;

              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number }));
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`#${number} does not exist.`);
                  continue;
                }
                throw error;
              }

              if (issue.pull_request) {
                core.info(`#${number} is a pull request, skipping.`);
                continue;
              }
              if (issue.state === "closed") {
                core.info(`#${number} is already closed.`);
                continue;
              }

              await github.rest.issues.update({
                ...context.repo,
                issue_number: number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed #${number}.`);
            }
